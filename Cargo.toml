[workspace]
members = [
    "crates/tfheprus-core",
    "crates/tfheprus-circuits",
    "crates/tfheprus-prover",
    "crates/tfheprus-cli",
]
exclude = ["thirdparties/Plonky3-recursion"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/virtualsecureplatform/TFHEprus"

[workspace.dependencies]
rand = "0.8"
rand_chacha = "0.3"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
sha3 = "0.10"
thiserror = "1"
p3-batch-stark = "0.9.0-rc.2"
p3-air = "0.9.0-rc.2"
p3-challenger = "0.9.0-rc.2"
p3-commit = "0.9.0-rc.2"
p3-circuit = { path = "thirdparties/Plonky3-recursion/circuit" }
p3-circuit-prover = { path = "thirdparties/Plonky3-recursion/circuit-prover", features = ["parallel"] }
p3-dft = "0.9.0-rc.2"
p3-field = "0.9.0-rc.2"
p3-fri = "0.9.0-rc.2"
p3-goldilocks = "0.9.0-rc.2"
p3-keccak-air = { version = "0.9.0-rc.2", features = ["parallel"] }
p3-lookup = "0.9.0-rc.2"
p3-matrix = "0.9.0-rc.2"
p3-merkle-tree = "0.9.0-rc.2"
p3-recursion = { path = "thirdparties/Plonky3-recursion/recursion" }
p3-symmetric = "0.9.0-rc.2"
p3-uni-stark = "0.9.0-rc.2"
